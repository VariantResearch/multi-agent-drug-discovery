[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "madd"
version = "0.1.0"
description = "Provider-neutral multi-agent research backbone with mechanical evidence auditing: schemas, claim and citation auditors, live citation resolution, consensus logic, debate engine, budget enforcement, Gate 0 retrospective set, CLI. No live model calls."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
madd = "madd.cli:main"

[tool.setuptools.packages.find]
include = ["madd*"]

[tool.setuptools.package-data]
madd = ["schemas/*.json", "data/*.json"]
